name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # 테스트는 Testcontainers로 MySQL 컨테이너를 직접 띄운다(GitHub Actions 우분투 러너에는 Docker가 있다).
    # 그래서 CI에 MySQL 서비스와 DB_* 환경 변수를 따로 두지 않는다(2026-11-09).

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Windows에서 커밋하면 gradlew 실행 권한이 빠져 "Permission denied"가 날 수 있다
      - name: gradlew 실행 권한
        run: chmod +x gradlew

      - name: 테스트 + 빌드
        run: ./gradlew build
