name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # 테스트(contextLoads 등)가 실제 DB에 연결하므로 CI 안에서 MySQL을 띄운다
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: myrecipe
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_URL: jdbc:mysql://localhost:3306/myrecipe?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: test
      DB_PASSWORD: test
      REDIS_PASSWORD: ""


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Windows에서 커밋하면 gradlew 실행 권한이 빠져 "Permission denied"가 날 수 있다
      - name: gradlew 실행 권한
        run: chmod +x gradlew

      - name: 테스트 + 빌드
        run: ./gradlew build
